<script>

/* ============ 2. ESTADO ============ */

try {

/* ============ 3. AUDIO (WebAudio sintetizado) ============ */
let ac = null, muted = false;
function audio() {
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (ac && ac.state === 'suspended') ac.resume();
  return ac;
}
function beep(freq, dur, type = 'square', vol = 0.05) {
  const a = audio(); if (!a || muted) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, a.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
  o.connect(g).connect(a.destination); o.start(); o.stop(a.currentTime + dur);
}
const sfx = {
  move:   () => beep(440, 0.05),
  select: () => { beep(523, 0.08); setTimeout(() => beep(784, 0.12), 70); },
  back:   () => beep(300, 0.08, 'triangle'),
  shoot:  () => beep(880, 0.03, 'square', 0.03),
  pick:   () => { beep(920,.045,'triangle',.03); setTimeout(()=>beep(1380,.04,'sine',.02),35); },
  build:  () => { beep(180,.14,'sawtooth',.06); setTimeout(()=>beep(420,.09,'triangle',.035),55); },
  core:   () => { beep(80,.3,'sawtooth',.12); beep(54,.22,'triangle',.06); },
  kill:   () => noise(0.06),
};
let lastNoise = 0;
function noise(dur, vol = 0.04) {
  const a = audio(); if (!a || muted || S.t - lastNoise < 0.04) return; lastNoise = S.t;
  const b = a.createBuffer(1, a.sampleRate * dur, a.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
  const s = a.createBufferSource(), g = a.createGain(); g.gain.value = vol;
  s.buffer = b; s.connect(g).connect(a.destination); s.start();
}
const muteBtn = document.getElementById('mute');
muteBtn.onclick = () => { muted = !muted; muteBtn.textContent = 'Sonido: ' + (muted ? 'no' : 'sí'); muteBtn.blur(); };

/* ============ 4. INPUT ============ */
const keys = {};   // teclas mantenidas (movimiento en partida)
addEventListener('keydown', e => {
  if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code)) e.preventDefault();
  keys[e.code] = true;
  if (!e.repeat) onKeyPress(e.code);
});
addEventListener('keyup', e => { keys[e.code] = false; });

function onKeyPress(code) {
  if (S.screen === 'title') {
    if (code === 'Enter') { audio(); sfx.select(); S.screen = 'select'; }
  } else if (S.screen === 'select') {
    if (code === 'ArrowLeft')  moveFocus(-1);
    if (code === 'ArrowRight') moveFocus(1);
    if (code === 'Enter')      choose(S.focus);
    if (code === 'Escape')     { sfx.back(); S.screen = 'title'; }
  } else if (S.screen === 'play') {
    if (S.shopOpen) {
      if (code === 'Space' && S.phase === 'rest') { skipRest(); return; }
      if (code === 'Escape' || code === 'Enter' || code === 'KeyB') { S.shopOpen=false; sfx.back(); }
      else if (code === 'KeyR') rerollShop();
      else if (/^Digit[1-5]$/.test(code)) buyShop(+code[5]-1);
      return;
    }
    if (S.techOpen) {
      if (code === 'Escape' || code === 'KeyT') S.techOpen=false;
      else if (/^Digit[1-6]$/.test(code)) buyTech(+code[5]-1);
      return;
    }
    if (S.customOpen) {
      if (code === 'Escape' || code === 'KeyP') S.customOpen=false;
      else if (code === 'ArrowLeft' || code === 'ArrowRight') S.cosmetic=(S.cosmetic+(code==='ArrowRight'?1:3))%4;
      return;
    }
    if (code === 'Escape') { sfx.back(); S.screen = 'select'; return; }
    if (code === 'KeyB' && S.phase === 'rest') { openShop(); return; }
    if (code === 'Space' && S.phase === 'rest') { skipRest(); return; }
    if (code === 'KeyT' && S.phase === 'rest') { S.techOpen=true; return; }
    if (code === 'KeyP' && S.phase === 'rest') { S.customOpen=true; return; }
    if (S.offer.length && /^Digit[1-3]$/.test(code)) pickCard(+code[5] - 1);
    else if (/^Digit[1-5]$/.test(code)) { S.pendingBuild=+code[5]; float(S.hero.x,S.hero.y-24,'Clic para colocar torre '+code[5]); }
    if (code === 'KeyE') upgradeNearbyTower();
    if (code === 'KeyZ') evolveNearbyTower(1);
    if (code === 'KeyC') evolveNearbyTower(2);
    if (code === 'KeyX') { if(nearbyTower()) removeNearbyTower(); else if(S.up.refund && S.phase === 'rest') refund(); }
    const dir = { ArrowLeft:[-1,0], KeyA:[-1,0], ArrowRight:[1,0], KeyD:[1,0], ArrowUp:[0,-1], KeyW:[0,-1], ArrowDown:[0,1], KeyS:[0,1] }[code];
    if (dir && S.chosen.id === 'kest') {   // doble pulsación = dash
      if (S.lastKey === code && S.t - S.lastT < 0.25 && S.dashCd <= 0) { S.dash = { t:0.15, dx:dir[0], dy:dir[1] }; S.dashCd = 1.2; }
      S.lastKey = code; S.lastT = S.t;
    }
  } else if (S.screen === 'over') {
    if (code === 'Enter' || code === 'KeyR') choose(S.focus);
    if (code === 'KeyC' || code === 'Escape') { sfx.back(); S.screen = 'select'; }
  }
}
function moveFocus(d) { S.focus = (S.focus + d + CHARS.length) % CHARS.length; sfx.move(); }
function choose(i) {
  S.focus = i; S.chosen = CHARS[i]; sfx.select();
  try { localStorage.setItem('bastion.char', S.chosen.id); } catch (e) {}
  startRun();
}
function startRun() {
  S.screen = 'play';
  Object.assign(S, { hero:{ x:760, y:480, hp:100, maxHp:100, hurt:0 }, camera:{x:0,y:0}, enemies:[], towers:[], scraps:[], particles:[], floaters:[], beams:[], puddles:[], enemyShots:[], weatherDrops:[],
    up:{}, offer:[], wave:0, phase:'rest', timer:6, hp:20, kills:0, scrapTotal:0, carried:60,
    shotCd:0, boost:0, dash:null, dashCd:0, coreCd:3, won:false, toSpawn:0,
    shopOpen:false, techOpen:false, customOpen:false, pendingBuild:0, coreMax:20, coreUpgrades:0, techLevels:{damage:0,armor:0,range:0,income:0,speed:0,repair:0}, cosmetic:0, bossNotice:0, bossName:'', shopItems:[], shopStockReady:false, shopRerolls:1, unlocked:[1], materials:{metal:5,crystal:2,circuit:1}, relics:[], event:null, eventText:'', eventCd:0, weather:'clear', weatherT:0, weapon:'Pulso', weaponLevel:1, armor:0, heroLevel:1, mapIndex:Math.floor(Math.random()*MAPS.length) });
  applyMap(S.mapIndex);
}

// Ratón: coordenadas del canvas (el canvas se escala por CSS)
function mousePos(e) {
  const r = cv.getBoundingClientRect();
  return { x:(e.clientX - r.left) * W / r.width, y:(e.clientY - r.top) * H / r.height };
}
function cardAt(p) {
  for (let i = 0; i < CHARS.length; i++) {
    const r = cardRect(i, false);
    if (p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h) return i;
  }
  return -1;
}
cv.addEventListener('mousemove', e => {
  if (S.screen !== 'select') return;
  const i = cardAt(mousePos(e));
  if (i >= 0 && i !== S.focus) { S.focus = i; sfx.move(); }
});
cv.addEventListener('click', e => {
  audio();
  if (S.screen === 'title') { sfx.select(); S.screen = 'select'; return; }
  const p = mousePos(e);
  if (S.screen === 'select') { const i = cardAt(p); if (i >= 0) choose(i); }
  else if (S.screen === 'play' && S.shopOpen) { if(S.phase==='rest'&&p.x>W-160&&p.y>100&&p.y<145){skipRest();return;} if(p.x>875 && p.y<115){S.shopOpen=false;sfx.back();return;} const i = shopAt(p); if (i >= 0) buyShop(i); }
  else if (S.screen === 'play' && S.techOpen) { if(p.x>875&&p.y<115){S.techOpen=false;return;} const i=Math.floor((p.x-72)/142); if(p.y>175&&p.y<390&&i>=0&&i<6)buyTech(i); }
  else if (S.screen === 'play' && S.customOpen) { if(p.x>875&&p.y<115){S.customOpen=false;return;} if(p.x<480)S.cosmetic=(S.cosmetic+3)%4;else S.cosmetic=(S.cosmetic+1)%4; }
  else if (S.screen === 'play' && S.phase==='rest' && p.x>W-160 && p.y>100 && p.y<145) { skipRest(); }
  else if (S.screen === 'play' && S.offer.length) { const i = offerAt(p); if (i >= 0) pickCard(i); }
  else if (S.screen === 'play') {
    const wx=p.x+S.camera.x,wy=p.y+S.camera.y;
    if(S.pendingBuild){build(S.pendingBuild,wx,wy);}
    else {const t=nearest0(S.towers,{x:wx,y:wy},34);if(t){S.selectedTower=t;float(t.x,t.y-32,'Nv.'+(t.level||1)+' · E mejorar · Z/C evolución · X retirar');}}
  }
  else if (S.screen === 'over' && p.y > 380 && p.y < 430) {
    if (p.x > 280 && p.x < 470) choose(S.focus); else if (p.x > 490 && p.x < 700) S.screen = 'select';
  }
});

/* ============ 5. UPDATE ============ */
function update(dt) {
  S.t += dt;
  if (S.screen === 'play') updatePlay(dt);
}
/* ---- Mapa y datos de partida ---- */
const MAPS = [
 {name:'Yermo industrial',core:{x:1100,y:750},routes:[

 ],nodes:[[760,250],[875,455],[1015,590],[1850,530],[1580,620],[1320,875],[1330,1160],[355,940],[510,820],[710,700],[1490,730],[1735,920]]},
 {name:'Cráter del vacío',core:{x:1110,y:755},routes:[

  [[1110,1480],[1110,1290],[1340,1290],[1340,1030],[1230,910],[1110,755]],
  [[20,755],[250,755],[250,1020],[610,1020],[850,900],[1110,755]]
 ],nodes:[[815,255],[930,465],[1040,600],[1860,560],[1610,660],[1360,900],[1310,1180],[345,950],[520,835],[750,725],[1530,765],[1750,940]]}

];
let ROUTES=MAPS[0].routes, NODES=MAPS[0].nodes, CORE=MAPS[0].core;
function applyMap(i){ const m=MAPS[i%MAPS.length]; ROUTES=m.routes.map(r=>r.map(p=>[...p])); NODES=m.nodes.map(p=>[...p]); CORE={...m.core}; S.mapName=m.name; S.hero.x=CORE.x; S.hero.y=CORE.y+145; S.camera={x:0,y:0}; }

const TOWER = { 1:['Balista',30,200,0.8], 2:['Mortero',45,230,1.6], 3:['Bruma',35,130,0.15], 4:['Tótem',40,0,0], 5:['Lanzallamas',40,110,0.2] };
const TSHAPE = { 1:'diamond', 2:'square', 3:'circle', 4:'hex', 5:'tri' };
const ENEMY = { c:{hp:1,sp:95,r:7}, t:{hp:7,sp:39,r:14}, p:{hp:4,sp:58,r:10}, k:{hp:1.5,sp:125,r:6}, s:{hp:3,sp:48,r:10}, b:{hp:34,sp:30,r:21}, r:{hp:5,sp:43,r:11}, h:{hp:11,sp:34,r:13}, u:{hp:3.5,sp:82,r:9} };
const BOSS_NAMES=['EL COLOSAL','REINA DE CHATARRA','DEVORADOR DEL VACÍO'];
const CARDS = [
  ['puddle','Charcos','El mortero deja charcos de fuego'], ['chain','Cadena','La balista encadena a un segundo objetivo'],
  ['heal','Tótem sanador','El tótem también repara el núcleo'], ['rush','Impulso','Recoger chatarra te da 1 s de velocidad'],
  ['boom','Reventón','Al morir, un enemigo tiene 20% de explotar'], ['refund','Reembolso','En el descanso, X reembolsa una torre al 70%'],
  ['pierce','Perforante','Tu disparo atraviesa a un segundo enemigo'], ['mark','Bruma letal','Los enemigos ralentizados reciben +50% de daño'],
  ['burn','Incendiario','El lanzallamas prende: quema 2 s más'], ['feed','Chatarra viva','Recoger chatarra recarga 15% las torres cercanas'],
  ['quake','Onda','Al construir una torre, una onda empuja enemigos'], ['guard','Guardián','El núcleo dispara al enemigo más cercano'] ];

const cl = (v, a, b) => Math.max(a, Math.min(b, v));
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
function nearest(p, range, skip) {
  let b = null, bd = range;
  for (const e of S.enemies) { if (e === skip || e.hp <= 0) continue; const d = dist(p, e); if (d < bd) { bd = d; b = e; } }
  return b;
}
function float(x, y, v) { S.floaters.push({ x, y, t:0.7, s: typeof v === 'number' ? String(Math.round(v * 10) / 10) : v }); }
function hit(e, d, quiet) { if (e.t==='h'&&!e.shieldBroken) d*=.42; if(e.boss&&e.bossPhase===2)d*=.82; if(e.boss&&e.bossPhase===3)d*=.72; if (e.slow > 0 && S.up.mark) d *= 1.5; e.hp -= d; if (!quiet) float(e.x, e.y - 10, d); }
function beam(a, b) { S.beams.push({ x1:a.x, y1:a.y, x2:b.x, y2:b.y, t:0.08 }); }
function puff(x, y, n, c, sp) { for (let i = 0; i < n; i++) { const a = Math.random() * 6.283, v = sp * (0.4 + Math.random()); S.particles.push({ x, y, vx:Math.cos(a) * v, vy:Math.sin(a) * v, t:0.4, c }); } }
function boom(x, y, r, d, push) {
  for (const e of S.enemies) {
    const dd = dist({ x, y }, e); if (dd >= r) continue;
    if (d) hit(e, d);
    if (push && e.t !== 't') { e.x += (e.x - x) / (dd || 1) * 16; e.y += (e.y - y) / (dd || 1) * 16; }   // el tanque ignora el empuje
  }
  puff(x, y, 8, C.dim, 90);
}
function mk(t, route, off, x, y, seg) {
  const R = ROUTES[route], hp = ENEMY[t].hp * (1 + 0.22 * (S.wave - 1)) * (1 + S.mapIndex*0.12);
  S.enemies.push({ t, route, seg:seg || 1, hp, maxHp:hp, slow:0, burn:0, attackCd:1+Math.random()*1.5, phase:Math.random()*6.28,
    x: x ?? R[0][0] + (route ? 0 : off), y: y ?? R[0][1] + (route ? off : 0) });
}
function spawnGroup() {
  const w=S.wave,r=Math.random();let t='c',n=4+Math.floor(w/3);
  if(w>=7&&r<0.10){t='r';n=1+Math.floor(w/10);}else if(w>=6&&r<0.20){t='h';n=2+Math.floor(w/8);}else if(w>=8&&r<0.30){t='u';n=3+Math.floor(w/7);}else if(w>=2&&r<0.39){t='k';n=3+Math.floor(w/6);}else if(w>=3&&r<0.51){t='t';n=1+Math.floor(w/9);}else if(w>=4&&r<0.64){t='p';n=1;}else if(w>=3&&r<0.80){t='s';n=2+Math.floor(w/8);}else if(w>=5&&r<0.86){t='b';n=1;}
  for (let i = 0; i < n; i++) mk(t, Math.floor(Math.random()*ROUTES.length), -i * 14);   // desde la oleada 6, dos rutas
  S.toSpawn -= n;
}
function die(e) {
